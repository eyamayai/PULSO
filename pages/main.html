<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073c36">
<meta name="robots" content="noindex,nofollow">
<title>PULSO | Acceso</title>
<link rel="icon" type="image/webp" href="/icono-original.webp">
<link rel="stylesheet" href="/acceso.css">
<script src="/acceso-login.js" defer></script>
</head>
<body>
<main class="login-page">
  <div class="wave wave-top" aria-hidden="true"></div>
  <div class="wave wave-bottom" aria-hidden="true"></div>
  <div class="orbit-zone" aria-hidden="true">
    <div class="orbit orbit-outer"></div>
    <div class="orbit orbit-mid"></div>
    <div class="orbit orbit-inner"></div>
    <div class="orbit-glow"></div>
    <img class="brand-icon" src="/icono-original.webp" alt="">
  </div>
  <section class="login-card" aria-labelledby="login-heading">
    <div class="login-card-inner">
      <div class="logo-panel">
        <img class="brand-logo" src="/logo-original-encuadrado.webp" alt="PULSO. El pulso de tu operación." width="604" height="252">
      </div>
      <div class="portal-label"><span>Portal operativo</span></div>
      <h1 id="login-heading">Bienvenido</h1>
      <p class="subtitle">Acceso corporativo</p>
      <form class="login-form" aria-label="Inicio de sesión">
        <label class="sr-only" for="login-email">Correo electrónico</label>
        <div class="field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
          <input id="login-email" type="email" placeholder="Correo electrónico" autocomplete="username" inputmode="email" maxlength="254" required>
        </div>
        <label class="sr-only" for="login-password">Contraseña</label>
        <div class="field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input id="login-password" type="password" placeholder="Contraseña" autocomplete="current-password" maxlength="128" required>
        </div>
        <button class="sign-in" type="submit">Iniciar sesión</button>
      </form>
      <p id="login-status" class="login-status" aria-live="polite" role="status"></p>
      <p class="project-label">MinTIC · Costa R1</p>
    </div>
  </section>
</main>
</body>
</html>
