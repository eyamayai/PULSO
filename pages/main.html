<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073c36"><meta name="robots" content="noindex,nofollow">
<title>PULSO | Acceso</title><link rel="icon" href="/pulso-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/pulso.css">
</head>
<body>
<main class="auth-page">
<div class="auth-panel">
  <section class="auth-visual" aria-label="Identidad PULSO">
    <div class="wordmark light"><img src="/pulso-icon.svg" alt=""><div><strong>PULSO</strong><small>MinTIC · COSTA R1</small></div></div>
    <div class="halo" aria-hidden="true"><img src="/pulso-icon.svg" alt=""></div>
    <div class="auth-meta"><span class="eyebrow">DOMINION · CLARO</span><h1>Plataforma Unificada de Logística, Seguimiento y Operaciones</h1></div>
  </section>
  <section class="auth-content" aria-label="Acceso al sistema">
    <div class="login-box">
      <div class="top-identity"><img src="/pulso-icon.svg" alt="Icono PULSO"><span>PORTAL OPERATIVO</span></div>
      <h2>¡Bienvenido!</h2>
      <p class="caption">Plataforma Unificada de Logística, Seguimiento y Operaciones</p>
      <p class="region">MinTIC - Costa R1</p>
      <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" placeholder="correo@empresa.com" disabled></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" disabled></div>
      <button class="primary" type="button" disabled>Iniciar sesión</button>
      <div class="auth-foot"><span>Acceso en preparación</span><a class="preview-link" href="/inicio">Vista de inicio</a></div>
      <div class="auth-bottom">PULSO · MinTIC - Costa R1</div>
    </div>
  </section>
</div>
</main>
</body>
</html>
