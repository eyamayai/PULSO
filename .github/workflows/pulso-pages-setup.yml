name: Crear PULSO en Cloudflare Pages (GitHub)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pulso-pages-setup.yml'

permissions:
  contents: read

concurrency:
  group: pulso-pages-setup
  cancel-in-progress: false

jobs:
  create_pages:
    name: Crear Pages y conectar repositorio PULSO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obtener código desde GitHub
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar que la interfaz está preparada
        run: |
          test -f pages/main.html
          test -f pages/index.html
          grep -q 'Plataforma Unificada de Logística, Seguimiento y Operaciones' pages/main.html
          grep -q 'MinTIC - Costa R1' pages/main.html

      - name: Crear Pages con GitHub y solicitar publicación
        run: node .github/scripts/create-pulso-pages.mjs
