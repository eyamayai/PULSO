name: Publicar PULSO en Cloudflare Pages (GitHub Actions)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'cloudflare/migrations/0002_autenticacion.sql'
      - 'cloudflare/migrations/0003_auth_passwords_compat.sql'
      - 'test/auth.test.mjs'
      - '.github/scripts/prepare-cloudflare-auth.mjs'
      - '.github/scripts/bootstrap-admin.mjs'
      - '.github/scripts/verify-live-auth.mjs'
      - '.github/scripts/create-pulso-pages.mjs'
      - '.github/workflows/pulso-pages-setup.yml'

permissions:
  contents: read

concurrency:
  group: pulso-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Autenticación PULSO + Pages y D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULSO_PAGES_PROJECT: pulso-mintic
      CI: true
    steps:
      - name: Obtener PULSO de GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar imagen original y código seguro
        shell: bash
        run: |
          set -euo pipefail
          for file in pages/index.html pages/main.html pages/inicio.html pages/pulso.css pages/pulso-icon.svg pages/logo-original.webp pages/logo-original-encuadrado.webp pages/icono-original.webp pages/acceso.css pages/acceso-login.js pages/inicio-session.js pages/inicio-ui.js pages/auth-worker.mjs pages/_headers cloudflare/migrations/0002_autenticacion.sql cloudflare/migrations/0003_auth_passwords_compat.sql; do
            test -s "$file"
          done
          grep -q 'logo-original-encuadrado.webp' pages/main.html
          grep -q 'MinTIC · Costa R1' pages/main.html
          grep -q 'acceso-login.js' pages/main.html
          grep -q 'inicio-session.js' pages/inicio.html
          grep -q 'Aplicaciones' pages/inicio.html
          grep -q 'logo-original-encuadrado.webp' pages/inicio.html
          grep -q 'icono-original.webp' pages/inicio.html
          grep -q 'inicio-ui.js' pages/inicio.html
          grep -q 'Sin información disponible' pages/inicio.html
          node --check pages/inicio-ui.js
          grep -q 'overflow:hidden' pages/acceso.css
          if grep -q 'Plataforma Unificada de Logística' pages/main.html; then
            echo 'El acceso no debe repetir textos institucionales.' >&2
            exit 1
          fi

      - name: Pruebas unitarias de autenticación
        run: node --test --disable-warning=ExperimentalWarning test/auth.test.mjs

      - name: Validar proyecto Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: node .github/scripts/create-pulso-pages.mjs

      - name: Asociar Pages con D1 existente y preparar migración
        run: node .github/scripts/prepare-cloudflare-auth.mjs

      - name: Crear tablas de acceso sin tocar inventario
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0002_autenticacion.sql
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0003_auth_passwords_compat.sql

      - name: Preparar administrador inicial si fue autorizado
        env:
          PULSO_ADMIN_EMAIL: ${{ secrets.PULSO_ADMIN_EMAIL }}
          PULSO_ADMIN_PASSWORD: ${{ secrets.PULSO_ADMIN_PASSWORD }}
        run: node .github/scripts/bootstrap-admin.mjs

      - name: Crear el administrador solo si la base no tiene usuarios
        if: env.PULSO_FIRST_ADMIN_SQL != ''
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file "$PULSO_FIRST_ADMIN_SQL"
          rm -f "$PULSO_FIRST_ADMIN_SQL"

      - name: Publicar interfaz y función de acceso en Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pulso-public"
          cp pages/index.html pages/main.html pages/inicio.html pages/pulso.css pages/pulso-icon.svg pages/logo-original.webp pages/logo-original-encuadrado.webp pages/icono-original.webp pages/acceso.css pages/acceso-login.js pages/inicio-session.js pages/inicio-ui.js pages/_headers "$RUNNER_TEMP/pulso-public/"
          cp pages/auth-worker.mjs "$RUNNER_TEMP/pulso-public/_worker.js"
          npx --yes wrangler@4.157.0 pages deploy "$RUNNER_TEMP/pulso-public" --project-name pulso-mintic --branch main

      - name: Verificar en Cloudflare acceso protegido y API real
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PULSO_PAGES_DOMAIN:-}" != 'pulso-mintic.pages.dev' ]; then
            echo 'Cloudflare Pages no confirmó el dominio esperado.' >&2
            exit 1
          fi
          ROOT='https://pulso-mintic.pages.dev'
          READY=false
          for attempt in $(seq 1 18); do
            LOGIN_HTTP=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/pulso-login.html" --write-out '%{http_code}' "$ROOT/main" || true)
            API_HTTP=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/pulso-auth-health.json" --write-out '%{http_code}' "$ROOT/api/auth/health" || true)
            PROTECTED_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/inicio" || true)
            if [ "$LOGIN_HTTP" = '200' ] && grep -q 'acceso-login.js' "$RUNNER_TEMP/pulso-login.html" && [ "$API_HTTP" = '200' ] && grep -q '"ready":true' "$RUNNER_TEMP/pulso-auth-health.json" && [ "$PROTECTED_HTTP" = '302' ]; then
              READY=true
              break
            fi
            echo "Verificando el acceso a PULSO ($attempt/18): login=$LOGIN_HTTP api=$API_HTTP inicio=$PROTECTED_HTTP"
            sleep 5
          done
          if [ "$READY" != true ]; then
            echo 'La autenticación o la protección de Inicio aún no pasaron las pruebas en línea.' >&2
            exit 1
          fi
          for asset in logo-original-encuadrado.webp icono-original.webp acceso.css acceso-login.js; do
            CODE=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/$asset" --write-out '%{http_code}' "$ROOT/$asset" || true)
            if [ "$CODE" != '200' ] || [ ! -s "$RUNNER_TEMP/$asset" ]; then
              echo "Falta un recurso de acceso: $asset (HTTP $CODE)" >&2
              exit 1
            fi
          done
          for asset in inicio-ui.js pulso.css; do
            CODE=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/$asset" --write-out '%{http_code}' "$ROOT/$asset" || true)
            if [ "$CODE" != '200' ] || [ ! -s "$RUNNER_TEMP/$asset" ]; then
              echo "Falta recurso de Inicio: $asset (HTTP $CODE)" >&2
              exit 1
            fi
          done
          echo '## PULSO con autenticación real desplegada' >> "$GITHUB_STEP_SUMMARY"
          echo '[Abrir PULSO](https://pulso-mintic.pages.dev/main)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Protección de Inicio: verificada. API auth/D1: verificada.' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${PULSO_FIRST_ADMIN_SQL:-}" ]; then
            echo 'Falta configurar PULSO_ADMIN_EMAIL y PULSO_ADMIN_PASSWORD para crear la primera cuenta.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Se ejecutó el alta inicial sin exponer el usuario ni la contraseña en el registro.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'PULSO login y API verificados en https://pulso-mintic.pages.dev/main'
      - name: Verificar inicio y cierre reales al configurar primer administrador
        env:
          PULSO_ADMIN_EMAIL: ${{ secrets.PULSO_ADMIN_EMAIL }}
          PULSO_ADMIN_PASSWORD: ${{ secrets.PULSO_ADMIN_PASSWORD }}
        run: node .github/scripts/verify-live-auth.mjs
