name: Publicar PULSO en Cloudflare Pages (GitHub Actions)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'cloudflare/migrations/0002_autenticacion.sql'
      - 'cloudflare/migrations/0003_auth_passwords_compat.sql'
      - 'cloudflare/migrations/0004_maestras_personal_y_sap.sql'
      - 'cloudflare/migrations/0005_usuarios_permisos.sql'
      - 'cloudflare/migrations/0006_vinculo_personal_usuarios.sql'
      - 'cloudflare/migrations/0007_bodegas_aliados.sql'
      - 'cloudflare/migrations/0008_departamentos_aliados.sql'
      - 'cloudflare/migrations/0009_ingresos.sql'
      - 'cloudflare/migrations/0010_seriales_internos_ingresos.sql'
      - 'cloudflare/migrations/0011_clasificacion_estados_ingresos.sql'
      - 'cloudflare/migrations/0012_validacion_clasificacion_ingresos.sql'
      - 'test/auth.test.mjs'
      - '.github/scripts/prepare-cloudflare-auth.mjs'
      - '.github/scripts/bootstrap-admin.mjs'
      - '.github/scripts/verify-live-auth.mjs'
      - '.github/scripts/create-pulso-pages.mjs'
      - '.github/workflows/pulso-pages-setup.yml'

permissions:
  contents: read

concurrency:
  group: pulso-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Autenticación PULSO + Pages y D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PULSO_PAGES_PROJECT: pulso-mintic
      CI: true
    steps:
      - name: Obtener PULSO de GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar imagen original y código seguro
        shell: bash
        run: |
          set -euo pipefail
          for file in pages/index.html pages/main.html pages/inicio.html pages/pulso.css pages/pulso-icon.svg pages/logo-original.webp pages/logo-original-encuadrado.webp pages/icono-original.webp pages/acceso.css pages/acceso-login.js pages/inicio-session.js pages/inicio-ui.js pages/maestras.html pages/maestras.css pages/maestras.js pages/maestras-import.js pages/usuarios.js pages/personal-access.js pages/bodegas.js pages/ingresos.html pages/ingresos.css pages/ingresos.js pages/activar.html pages/activar.js pages/activar.css pages/auth-worker.mjs pages/_headers cloudflare/migrations/0002_autenticacion.sql cloudflare/migrations/0003_auth_passwords_compat.sql cloudflare/migrations/0004_maestras_personal_y_sap.sql cloudflare/migrations/0005_usuarios_permisos.sql cloudflare/migrations/0006_vinculo_personal_usuarios.sql cloudflare/migrations/0007_bodegas_aliados.sql cloudflare/migrations/0008_departamentos_aliados.sql cloudflare/migrations/0009_ingresos.sql cloudflare/migrations/0010_seriales_internos_ingresos.sql cloudflare/migrations/0011_clasificacion_estados_ingresos.sql cloudflare/migrations/0012_validacion_clasificacion_ingresos.sql; do
            test -s "$file"
          done
          grep -q 'logo-original-encuadrado.webp' pages/main.html
          grep -q 'MinTIC · Costa R1' pages/main.html
          grep -q 'acceso-login.js' pages/main.html
          grep -q 'inicio-session.js' pages/inicio.html
          grep -q 'Aplicaciones' pages/inicio.html
          grep -q 'class="brand brand-original"' pages/inicio.html
          grep -q 'logo-original-encuadrado.webp' pages/inicio.html
          grep -q 'id="tab-personal"' pages/maestras.html
          grep -q 'id="tab-catalogo"' pages/maestras.html
          grep -q 'id="tab-usuarios"' pages/maestras.html
          grep -q 'id="tab-bodegas"' pages/maestras.html
          test "$(grep -o 'src="/usuarios.js"' pages/maestras.html | wc -l)" -eq 1
          grep -q 'void reload();' pages/usuarios.js
          grep -q 'void refresh();' pages/bodegas.js
          grep -q 'id="warehouse-table"' pages/maestras.html
          grep -q 'id="warehouse-dialog"' pages/maestras.html
          grep -q 'BODEGAS' pages/maestras-import.js
          grep -q 'for(const item of rows)' pages/maestras-import.js
          grep -q 'id="bulk-preview-count"' pages/maestras.html
          if grep -q 'rows.slice(0,8)' pages/maestras-import.js; then echo 'La vista previa no debe omitir registros' >&2; exit 1; fi
          node --check pages/bodegas.js
          grep -q 'NATIONAL_WAREHOUSE_DEPARTMENTS' pages/auth-worker.mjs
          grep -q 'CUNDINAMARCA' cloudflare/migrations/0008_departamentos_aliados.sql
          node --check pages/auth-worker.mjs
          node --check pages/ingresos.js
          grep -q 'id="ingress-wizard"' pages/ingresos.html
          grep -q 'id="ing-confirm"' pages/ingresos.html
          grep -q 'sheet.autoFilter' pages/ingresos.js
          grep -q 'ySplit:1' pages/ingresos.js
          grep -q "header:'Lote'" pages/ingresos.js
          grep -q "header:'Estado de Recepción'" pages/ingresos.js
          grep -q 'href="/ingresos"' pages/inicio.html
          grep -q 'href="/ingresos"' pages/maestras.html
          grep -q "CREATE TRIGGER IF NOT EXISTS ingress_ready_guard" cloudflare/migrations/0009_ingresos.sql
          grep -q 'usuarios.js' pages/maestras.html
          grep -q 'id="user-invite-dialog"' pages/maestras.html
          grep -q 'activation-form' pages/activar.html
          node --check pages/usuarios.js
          node --check pages/personal-access.js
          grep -q 'id="personnel-access-panel"' pages/maestras.html
          grep -q "check.id='personnel-select-all'" pages/maestras.js
          node --check pages/activar.js
          node --check pages/maestras.js
          node --check pages/maestras-import.js
          grep -q 'maestras-import.js' pages/maestras.html
          grep -q 'exceljs.min.js' pages/maestras.html
          grep -q 'srcset="/icono-original.webp"' pages/inicio.html
          grep -q 'icono-original.webp' pages/inicio.html
          grep -q 'inicio-ui.js' pages/inicio.html
          grep -q 'class="sidebar"' pages/inicio.html
          grep -q 'class="topbar"' pages/inicio.html
          grep -q 'id="module-search"' pages/inicio.html
          grep -q '#052b27' pages/pulso.css
          grep -q 'grid-template-columns:repeat(7' pages/pulso.css
          test "$(grep -o 'class="module-tile"' pages/inicio.html | wc -l)" -eq 14
          node --check pages/inicio-ui.js
          grep -q 'overflow:hidden' pages/acceso.css
          if grep -q 'Plataforma Unificada de Logística' pages/main.html; then
            echo 'El acceso no debe repetir textos institucionales.' >&2
            exit 1
          fi

      - name: Pruebas unitarias de autenticación
        run: node --test --disable-warning=ExperimentalWarning test/auth.test.mjs

      - name: Preparar lector de Excel para carga masiva (ExcelJS 4.4.0)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pulso-excel"
          npm install --prefix "$RUNNER_TEMP/pulso-excel" --no-save --ignore-scripts --no-audit --no-fund --silent exceljs@4.4.0
          test -s "$RUNNER_TEMP/pulso-excel/node_modules/exceljs/dist/exceljs.min.js"

      - name: Validar proyecto Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: node .github/scripts/create-pulso-pages.mjs

      - name: Asociar Pages con D1 existente y preparar migración
        run: node .github/scripts/prepare-cloudflare-auth.mjs

      - name: Inspeccionar esquema heredado de bodegas sin leer registros
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --command "PRAGMA table_info(master_warehouses)"

      - name: Crear tablas de acceso sin tocar inventario
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0002_autenticacion.sql
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0003_auth_passwords_compat.sql
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0004_maestras_personal_y_sap.sql
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0005_usuarios_permisos.sql
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0006_vinculo_personal_usuarios.sql
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0007_bodegas_aliados.sql
          # Una sola vez: reconstruye el CHECK de departamentos y preserva bodegas y auditoría.
          # El resto de despliegues no vuelve a reconstruir la tabla.
          WAREHOUSE_SCHEMA=$(npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='master_logistics_locations'")
          if ! printf '%s' "$WAREHOUSE_SCHEMA" | grep -q 'CUNDINAMARCA'; then
            npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0008_departamentos_aliados.sql
          else
            echo "La estructura nacional de Bodegas y Aliados ya está aplicada"
          fi

      - name: Crear tablas operativas de Ingresos sin modificar Maestras
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0009_ingresos.sql
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0010_seriales_internos_ingresos.sql
          # Las columnas se crean una única vez. Los triggers se actualizan en cada despliegue.
          INGRESS_SCHEMA=$(npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='ingress_items'")
          if ! printf '%s' "$INGRESS_SCHEMA" | grep -q 'availability_state'; then
            npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0011_clasificacion_estados_ingresos.sql
          else
            echo "La clasificación y los estados de recepción ya están instalados"
          fi
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file cloudflare/migrations/0012_validacion_clasificacion_ingresos.sql

      - name: Preparar administrador inicial si fue autorizado
        env:
          PULSO_ADMIN_EMAIL: ${{ secrets.PULSO_ADMIN_EMAIL }}
          PULSO_ADMIN_PASSWORD: ${{ secrets.PULSO_ADMIN_PASSWORD }}
        run: node .github/scripts/bootstrap-admin.mjs

      - name: Crear el administrador solo si la base no tiene usuarios
        if: env.PULSO_FIRST_ADMIN_SQL != ''
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 d1 execute DB --remote --config "$PULSO_AUTH_WRANGLER" --file "$PULSO_FIRST_ADMIN_SQL"
          rm -f "$PULSO_FIRST_ADMIN_SQL"

      - name: Publicar interfaz y función de acceso en Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pulso-public"
          cp pages/index.html pages/main.html pages/inicio.html pages/pulso.css pages/pulso-icon.svg pages/logo-original.webp pages/logo-original-encuadrado.webp pages/icono-original.webp pages/acceso.css pages/acceso-login.js pages/inicio-session.js pages/inicio-ui.js pages/maestras.html pages/maestras.css pages/maestras.js pages/maestras-import.js pages/usuarios.js pages/personal-access.js pages/bodegas.js pages/ingresos.html pages/ingresos.css pages/ingresos.js pages/activar.html pages/activar.js pages/activar.css pages/_headers "$RUNNER_TEMP/pulso-public/"
          cp "$RUNNER_TEMP/pulso-excel/node_modules/exceljs/dist/exceljs.min.js" "$RUNNER_TEMP/pulso-public/exceljs.min.js"
          cp pages/auth-worker.mjs "$RUNNER_TEMP/pulso-public/_worker.js"
          npx --yes wrangler@4.157.0 pages deploy "$RUNNER_TEMP/pulso-public" --project-name pulso-mintic --branch main

      - name: Verificar en Cloudflare acceso protegido y API real
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PULSO_PAGES_DOMAIN:-}" != 'pulso-mintic.pages.dev' ]; then
            echo 'Cloudflare Pages no confirmó el dominio esperado.' >&2
            exit 1
          fi
          ROOT='https://pulso-mintic.pages.dev'
          READY=false
          for attempt in $(seq 1 18); do
            LOGIN_HTTP=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/pulso-login.html" --write-out '%{http_code}' "$ROOT/main" || true)
            API_HTTP=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/pulso-auth-health.json" --write-out '%{http_code}' "$ROOT/api/auth/health" || true)
            PROTECTED_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/inicio" || true)
            if [ "$LOGIN_HTTP" = '200' ] && grep -q 'acceso-login.js' "$RUNNER_TEMP/pulso-login.html" && [ "$API_HTTP" = '200' ] && grep -q '"ready":true' "$RUNNER_TEMP/pulso-auth-health.json" && [ "$PROTECTED_HTTP" = '302' ]; then
              READY=true
              break
            fi
            echo "Verificando el acceso a PULSO ($attempt/18): login=$LOGIN_HTTP api=$API_HTTP inicio=$PROTECTED_HTTP"
            sleep 5
          done
          if [ "$READY" != true ]; then
            echo 'La autenticación o la protección de Inicio aún no pasaron las pruebas en línea.' >&2
            exit 1
          fi
          MAESTRAS_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/maestras" || true)
          PERSONAL_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/maestras/personal" || true)
          BODEGAS_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/maestras/bodegas" || true)
          BODEGAS_IMPORT_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/maestras/bodegas/import" || true)
          CATALOGO_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/maestras/catalogo" || true)
          IMPORT_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/maestras/import" || true)
          INGRESOS_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/ingresos" || true)
          INGRESOS_API_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/ingresos" || true)
          INGRESOS_CAT_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/ingresos/catalogos" || true)
          if [ "$INGRESOS_HTTP" != '302' ] || [ "$INGRESOS_API_HTTP" != '401' ] || [ "$INGRESOS_CAT_HTTP" != '401' ]; then
            echo "Ingresos no está protegido: página=$INGRESOS_HTTP API=$INGRESOS_API_HTTP catálogos=$INGRESOS_CAT_HTTP" >&2
            exit 1
          fi
          USERS_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/usuarios" || true)
          LINK_HTTP=$(curl --silent --show-error --max-time 12 --output /dev/null --write-out '%{http_code}' "$ROOT/api/usuarios/vincular-personal" || true)
          if [ "$LINK_HTTP" != '401' ]; then
            echo "La vinculación de Personal no está protegida, HTTP $LINK_HTTP" >&2
            exit 1
          fi
          ACTIVATION_HTTP=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/pulso-activar.html" --write-out '%{http_code}' "$ROOT/activar" || true)
          if [ "$USERS_HTTP" != '401' ] || [ "$ACTIVATION_HTTP" != '200' ] || ! grep -q 'activation-form' "$RUNNER_TEMP/pulso-activar.html"; then
            echo "Usuarios o activación no están disponibles/protegidos: usuarios=$USERS_HTTP activación=$ACTIVATION_HTTP" >&2
            exit 1
          fi
          if [ "$MAESTRAS_HTTP" != '302' ] || [ "$PERSONAL_HTTP" != '401' ] || [ "$CATALOGO_HTTP" != '401' ] || [ "$IMPORT_HTTP" != '401' ] || [ "$BODEGAS_HTTP" != '401' ] || [ "$BODEGAS_IMPORT_HTTP" != '401' ]; then
            echo "Maestras no está protegida: página=$MAESTRAS_HTTP personal=$PERSONAL_HTTP catalogo=$CATALOGO_HTTP" >&2
            exit 1
          fi
          for asset in logo-original-encuadrado.webp icono-original.webp acceso.css acceso-login.js; do
            CODE=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/$asset" --write-out '%{http_code}' "$ROOT/$asset" || true)
            if [ "$CODE" != '200' ] || [ ! -s "$RUNNER_TEMP/$asset" ]; then
              echo "Falta un recurso de acceso: $asset (HTTP $CODE)" >&2
              exit 1
            fi
          done
          for asset in inicio-ui.js pulso.css maestras.js maestras-import.js usuarios.js personal-access.js bodegas.js ingresos.js ingresos.css maestras.css activar.js activar.css exceljs.min.js; do
            CODE=$(curl --silent --show-error --max-time 12 --output "$RUNNER_TEMP/$asset" --write-out '%{http_code}' "$ROOT/$asset" || true)
            if [ "$CODE" != '200' ] || [ ! -s "$RUNNER_TEMP/$asset" ]; then
              echo "Falta recurso de Inicio: $asset (HTTP $CODE)" >&2
              exit 1
            fi
          done
          echo '## PULSO con autenticación real desplegada' >> "$GITHUB_STEP_SUMMARY"
          echo '[Abrir PULSO](https://pulso-mintic.pages.dev/main)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Protección de Inicio: verificada. API auth/D1: verificada.' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${PULSO_FIRST_ADMIN_SQL:-}" ]; then
            echo 'Falta configurar PULSO_ADMIN_EMAIL y PULSO_ADMIN_PASSWORD para crear la primera cuenta.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Se ejecutó el alta inicial sin exponer el usuario ni la contraseña en el registro.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'PULSO login y API verificados en https://pulso-mintic.pages.dev/main'
      - name: Verificar inicio y cierre reales al configurar primer administrador
        env:
          PULSO_ADMIN_EMAIL: ${{ secrets.PULSO_ADMIN_EMAIL }}
          PULSO_ADMIN_PASSWORD: ${{ secrets.PULSO_ADMIN_PASSWORD }}
        run: node .github/scripts/verify-live-auth.mjs
